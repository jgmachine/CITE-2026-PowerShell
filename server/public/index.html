<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiverSIS</title>
<style>
  :root {
    --bg: #06100d;
    --panel: #0c1d18;
    --panel-2: #10271f;
    --line: #1d4538;
    --text: #e6f7ef;
    --muted: #8fb5a6;
    --portal: #8cff3a;
    --portal-dim: #3f8f1a;
    --teal: #3fd9d0;
    --amber: #ffb627;
    --gray: #7d8b87;
    --red: #ff5c7a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font: 15px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(140, 255, 58, .12), transparent 60%),
      linear-gradient(rgba(63, 217, 208, .035) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(63, 217, 208, .035) 1px, transparent 1px) 0 0 / 28px 28px,
      var(--bg);
  }

  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 18px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(6, 16, 13, .88);
    backdrop-filter: blur(6px);
  }
  .portal {
    position: relative; flex: none;
    width: 54px; height: 54px; border-radius: 50%;
    background: conic-gradient(#b6ff6b, #2fbf3a, #8cff3a, #e3ffb8, #2fbf3a, #b6ff6b);
    filter: drop-shadow(0 0 14px rgba(140, 255, 58, .7));
    animation: spin 3.5s linear infinite;
  }
  .portal::after {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle, #f2ffe0 0%, #9dff4f 40%, #2e8f1f 100%);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(.82); } }
  h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
  h1 span { color: var(--portal); text-shadow: 0 0 14px rgba(140, 255, 58, .6); }
  .sub { color: var(--muted); font-size: 13px; }
  .search { flex: 1; max-width: 520px; margin-left: auto; }
  .search input {
    width: 100%; padding: 10px 16px; color: var(--text); font: inherit; font-size: 17px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--portal-dim); box-shadow: 0 0 0 2px var(--portal); }
  .card[hidden] { display: none; }
  .empty { padding: 28px 0; color: var(--muted); font-size: 17px; text-align: center; }
  .live { margin-left: 18px; font-size: 12px; letter-spacing: 2px; color: var(--portal); }
  .live::before { content: "●"; margin-right: 6px; animation: blink 1.2s steps(2) infinite; }
  .live.offline { color: var(--red); }
  @keyframes blink { 50% { opacity: .2; } }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 18px 28px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .stat small { color: var(--muted); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
  .stat b { display: block; font-size: 32px; font-variant-numeric: tabular-nums; }
  .stat.bump b { animation: bump .5s ease-out; }
  @keyframes bump { 40% { transform: scale(1.18); color: var(--portal); } }

  main { padding: 18px 28px 28px; }
  h2 { margin: 0 0 10px; color: var(--muted); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
  .card {
    display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  }
  .card img, .avatar {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--panel-2); object-fit: cover;
  }
  .avatar { display: grid; place-items: center; font-weight: 700; color: var(--portal); }
  .info { min-width: 0; flex: 1; }
  .top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name, .meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .name { min-width: 0; font-weight: 700; }
  .meta { color: var(--muted); font-size: 12px; }
  .card { width: 100%; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: border-color .15s, background .15s; }
  .card:hover, .card:focus-visible { border-color: var(--portal-dim); background: var(--panel-2); outline: none; }
  .card:focus-visible { box-shadow: 0 0 0 2px var(--portal); }
  .info { display: block; }
  .meta { display: block; }

  dialog {
    width: min(640px, calc(100vw - 32px)); padding: 0; color: var(--text);
    border: 1px solid var(--portal-dim); border-radius: 16px; background: var(--panel);
    box-shadow: 0 0 60px rgba(140, 255, 58, .25);
  }
  dialog::backdrop { background: rgba(2, 8, 6, .75); backdrop-filter: blur(3px); }
  .profile-head { display: flex; align-items: center; gap: 18px; padding: 22px 24px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .profile-head img, .profile-head .avatar { width: 112px; height: 112px; border-width: 3px; font-size: 40px; }
  .profile-head img { border: 3px solid var(--line); border-radius: 16px; object-fit: cover; }
  .profile-head h3 { margin: 0 0 4px; font-size: 26px; line-height: 1.15; }
  .profile-head .aka { color: var(--muted); font-size: 15px; }
  .profile-head .badge { display: inline-block; margin: 10px 0 0; padding: 2px 12px; font-size: 14px; }
  .close { margin-left: auto; align-self: flex-start; padding: 4px 12px; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
  .close:hover, .close:focus-visible { color: var(--text); border-color: var(--portal-dim); outline: none; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin: 0; padding: 22px 24px 26px; }
  .fields div { min-width: 0; }
  .fields .wide { grid-column: 1 / -1; }
  .fields dt { color: var(--muted); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
  .fields dd { margin: 2px 0 0; font-size: 18px; overflow-wrap: anywhere; }
  .fields .id { font-family: var(--mono); color: var(--teal); }
  .badge { flex: none; margin-left: auto; padding: 0 7px; border: 1px solid; border-radius: 999px; font-size: 11px; }
  .Active { color: var(--portal); border-color: var(--portal-dim); }
  .Withdrawn { color: var(--gray); border-color: #3b4744; }
  .Unknown { color: var(--amber); border-color: #7a5a12; }

  .new { animation: portal-in .8s cubic-bezier(.2, .9, .3, 1.25) both; }
  .new.card { box-shadow: 0 0 0 2px var(--portal), 0 0 26px rgba(140, 255, 58, .7); transition: box-shadow 2.5s ease-out; }
  .gone { animation: portal-out .6s ease-in forwards; }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes portal-in {
    from { opacity: 0; transform: scale(.15) rotate(-25deg); filter: hue-rotate(80deg) blur(4px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  @keyframes portal-out { to { opacity: 0; transform: scale(.1) rotate(35deg); filter: blur(6px); } }
  @keyframes flash { from { background: rgba(255, 182, 39, .35); } }

  footer { padding: 0 0 22px; color: var(--muted); font-size: 12px; text-align: center; }
  .reset { margin-left: 10px; padding: 2px 10px; color: var(--muted); font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; background: transparent; opacity: .7; }
  .reset:hover, .reset:focus-visible { color: var(--amber); border-color: var(--amber); opacity: 1; outline: none; }

  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    header { flex-wrap: wrap; }
    .search { order: 3; flex-basis: 100%; max-width: none; margin-left: 0; }
    .live { margin-left: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="portal" aria-hidden="true"></div>
  <div>
    <h1>Multiver<span>SIS</span></h1>
    <div class="sub">Multiverse Student Information System · Dimension C-137</div>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="Search students: name, ID, school, status..." aria-label="Search students" autocomplete="off">
  </div>
  <div class="live" id="live">LIVE</div>
</header>

<div class="stats">
  <div class="stat" id="stat-total"><small>Students</small><b>–</b></div>
  <div class="stat" id="stat-active"><small>Active</small><b>–</b></div>
  <div class="stat" id="stat-withdrawn"><small>Withdrawn</small><b>–</b></div>
  <div class="stat" id="stat-unknown"><small>Unknown</small><b>–</b></div>
</div>

<main>
  <section>
    <h2 id="heading">Students · newest first</h2>
    <div class="grid" id="students"></div>
    <div class="empty" id="empty" hidden>No students match that search in this dimension.</div>
  </section>
</main>

<dialog id="profile" aria-labelledby="profile-name"></dialog>

<footer>Contains zero real students. FERPA-compliant across all known dimensions.
  <button class="reset" id="reset" type="button">Reset demo data</button></footer>

<script>
  const studentEls = new Map();
  const studentData = new Map();
  let openId = null;
  let shownJson = '';
  let firstLoad = true;

  const esc = value => String(value ?? '').replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function badge(status) {
    const label = status === 'Unknown' ? '¯\\_(ツ)_/¯' : status;
    return `<span class="badge ${esc(status)}" title="${esc(status)}">${esc(label)}</span>`;
  }

  function avatar(s) {
    const initials = ((s.FirstName || '?')[0] + ((s.LastName || '')[0] || '')).toUpperCase();
    const fallback = `<div class="avatar">${esc(initials)}</div>`;
    if (!s.Photo) return fallback;
    // If the photo can't load (no internet), swap in the initials.
    return `<img src="${esc(s.Photo)}" alt="" loading="lazy"
      onerror="this.outerHTML='${fallback.replace(/"/g, '&quot;')}'">`;
  }

  function studentCard(s) {
    // A button, so every record opens its profile with a click, Enter, or Space.
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'card';
    el.innerHTML = `${avatar(s)}
      <span class="info">
        <span class="top">
          <span class="name" title="${esc(s.FirstName)} ${esc(s.LastName)}">${esc(s.FirstName)} ${esc(s.LastName)}</span>
          ${badge(s.EnrollmentStatus)}
        </span>
        <span class="meta">ID ${esc(s.StudentId)} · Grade ${esc(s.Grade ?? '?')}</span>
        <span class="meta" title="${esc(s.School)}">${esc(s.School)}</span>
      </span>`;
    el.dataset.status = s.EnrollmentStatus;
    el.dataset.id = s.StudentId;
    // Everything the search box looks through, in one lowercase string.
    el.dataset.search = [s.StudentId, s.FirstName, s.LastName, s.PreferredName, s.School, s.Program,
      s.EnrollmentStatus, s.Species, s.Gender, s.LastSeen, s.Notes, s.Grade ? `grade ${s.Grade}` : '']
      .filter(Boolean).join(' ').toLowerCase();
    el.hidden = !matches(el);
    return el;
  }

  // Every word typed must appear somewhere in the student's record.
  const words = () => document.getElementById('search').value.toLowerCase().split(/\s+/).filter(Boolean);
  const matches = el => words().every(word => el.dataset.search.includes(word));

  function applySearch() {
    let shown = 0;
    for (const el of studentEls.values()) {
      el.hidden = !matches(el);
      if (!el.hidden) shown++;
    }
    const searching = words().length > 0;
    document.getElementById('heading').textContent = searching
      ? `Students · ${shown} of ${studentEls.size} match`
      : 'Students · newest first';
    document.getElementById('empty').hidden = !(searching && shown === 0);
  }

  function field(label, value, extra = '') {
    const shown = value === null || value === undefined || value === '' ? '—' : value;
    return `<div class="${extra}"><dt>${esc(label)}</dt><dd>${esc(shown)}</dd></div>`;
  }

  function showProfile(id) {
    const s = studentData.get(id);
    const dialog = document.getElementById('profile');
    if (!s) { openId = null; if (dialog.open) dialog.close(); return; }
    // Nothing changed since the last refresh? Leave the open profile alone.
    const json = JSON.stringify(s);
    if (dialog.open && id === openId && json === shownJson) return;
    shownJson = json;
    const enrolled = s.Created ? new Date(s.Created).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) : '';
    dialog.innerHTML = `
      <div class="profile-head">
        ${avatar(s)}
        <div>
          <h3 id="profile-name">${esc(s.FirstName)} ${esc(s.LastName)}</h3>
          ${s.PreferredName ? `<div class="aka">Goes by “${esc(s.PreferredName)}”</div>` : ''}
          ${badge(s.EnrollmentStatus)}
        </div>
        <button class="close" type="button" autofocus>Close</button>
      </div>
      <dl class="fields">
        <div><dt>Student ID</dt><dd class="id">${esc(s.StudentId)}</dd></div>
        ${field('Grade', s.Grade)}
        ${field('School', s.School, 'wide')}
        ${field('Program', s.Program)}
        ${field('Attendance', s.AttendanceDays === null || s.AttendanceDays === undefined ? '' : `${s.AttendanceDays} ${s.AttendanceDays === 1 ? 'day' : 'days'}`)}
        ${field('Species', s.Species)}
        ${field('Gender', s.Gender)}
        ${field('Last seen', s.LastSeen, 'wide')}
        ${field('Notes', s.Notes, 'wide')}
        ${field('Enrolled', enrolled)}
        ${field('Source system ID', s.SourceId)}
      </dl>`;
    dialog.querySelector('.close').addEventListener('click', () => dialog.close());
    openId = id;
    if (!dialog.open) dialog.showModal();
  }

  function setStat(id, value) {
    const box = document.getElementById(id);
    const b = box.querySelector('b');
    if (b.textContent !== String(value)) {
      b.textContent = value;
      if (!firstLoad) { box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump'); }
    }
  }

  function render({ students = [] }) {
    setStat('stat-total', students.length);
    setStat('stat-active', students.filter(s => s.EnrollmentStatus === 'Active').length);
    setStat('stat-withdrawn', students.filter(s => s.EnrollmentStatus === 'Withdrawn').length);
    setStat('stat-unknown', students.filter(s => s.EnrollmentStatus === 'Unknown').length);

    // Students: add new ones through the portal, update changed ones, send deleted ones away.
    const grid = document.getElementById('students');
    const ids = new Set(students.map(s => s.StudentId));
    studentData.clear();
    for (const s of students) studentData.set(s.StudentId, s);
    // Keep an open profile current, so a change made from PowerShell shows up in it.
    if (openId !== null) showProfile(openId);
    let arrival = 0;
    for (const s of [...students].sort((a, b) => a.StudentId - b.StudentId)) {
      const existing = studentEls.get(s.StudentId);
      if (!existing) {
        const el = studentCard(s);
        if (!firstLoad) {
          el.classList.add('new');
          el.style.animationDelay = `${Math.min(arrival++ * 35, 2500)}ms`;
          setTimeout(() => el.style.boxShadow = 'none', 400 + Math.min(arrival * 35, 2500));
        }
        grid.prepend(el);
        studentEls.set(s.StudentId, el);
      } else if (existing.dataset.status !== s.EnrollmentStatus) {
        const el = studentCard(s);
        el.classList.add('flash');
        existing.replaceWith(el);
        studentEls.set(s.StudentId, el);
      }
    }
    for (const [id, el] of studentEls) {
      if (!ids.has(id)) {
        el.classList.add('gone');
        setTimeout(() => el.remove(), 650);
        studentEls.delete(id);
      }
    }

    applySearch();
    firstLoad = false;
  }

  async function refresh() {
    const live = document.getElementById('live');
    try {
      const response = await fetch('/dashboard/data', { cache: 'no-store' });
      render(await response.json());
      live.textContent = 'LIVE';
      live.classList.remove('offline');
    } catch {
      live.textContent = 'SERVER OFFLINE';
      live.classList.add('offline');
    }
  }

  document.getElementById('students').addEventListener('click', event => {
    const card = event.target.closest('.card');
    if (card) showProfile(Number(card.dataset.id));
  });
  // Reset: put the SIS back to its starter students, for the next run of the demo.
  document.getElementById('reset').addEventListener('click', async () => {
    if (!confirm('Reset MultiverSIS to the four starter students?')) return;
    await fetch('/dashboard/reset', { method: 'POST' });
    refresh();
  });

  const search = document.getElementById('search');
  search.addEventListener('input', applySearch);
  // Escape clears the search.
  search.addEventListener('keydown', event => {
    if (event.key === 'Escape') { search.value = ''; applySearch(); }
  });
  const profile = document.getElementById('profile');
  profile.addEventListener('close', () => { openId = null; });
  // A click on the dimmed area outside the profile closes it.
  profile.addEventListener('click', event => { if (event.target === profile) profile.close(); });

  refresh();
  setInterval(refresh, 1500);
</script>
</body>
</html>
